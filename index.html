<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dart Club JJAGD – Liga 2026/27</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #121417;
            --bg-surface: #1b1f24;
            --bg-elevated: #242930;
            --dart-red: #c81e1e;
            --dart-red-hover: #a51818;
            --dart-green: #15803d;
            --dart-green-light: #22c55e;
            --brass: #d4af37;
            --brass-hover: #b89528;
            --sisal-cream: #f5efe6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2f3640;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app-shell {
            width: 100%;
            max-width: 880px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65);
        }

        /* HEADER */
        .hero-header {
            background: linear-gradient(135deg, #1b1f24 0%, #14171a 60%, #261414 100%);
            padding: 20px;
            border-bottom: 2px solid var(--brass);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand-title {
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--sisal-cream);
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1.1;
        }

        .brand-title span.accent {
            color: var(--brass);
        }

        .season-sub {
            color: var(--brass);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* KOMPAKTER ADMIN BUTTON */
        .admin-trigger {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 7px 13px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: rgba(0, 0, 0, 0.35);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .admin-trigger:hover {
            border-color: var(--brass);
            color: var(--brass);
        }

        .admin-trigger.logged-in {
            background-color: rgba(21, 128, 61, 0.25);
            border-color: var(--dart-green-light);
            color: var(--dart-green-light);
        }

        /* BUTTONS */
        .btn {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 10px 16px;
            min-height: 44px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.18s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-sm {
            min-height: 38px;
            padding: 6px 14px;
            font-size: 0.85rem;
        }

        .btn-brass {
            background-color: var(--brass);
            color: #121417;
        }

        .btn-brass:hover {
            background-color: var(--brass-hover);
        }

        .btn-green {
            background-color: var(--dart-green);
            color: #fff;
        }

        .btn-green:hover {
            background-color: #166534;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-outline:hover {
            border-color: var(--brass);
            color: var(--brass);
        }

        /* TABS */
        .nav-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background-color: var(--bg-main);
            padding: 6px;
            margin: 18px 20px 0;
            border-radius: 10px;
            border: 1px solid var(--border);
            gap: 6px;
        }

        .tab-btn {
            font-family: 'Oswald', sans-serif;
            font-size: 1.05rem;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--dart-red);
            color: #fff;
            box-shadow: 0 4px 12px rgba(200, 30, 30, 0.35);
        }

        .content-body {
            padding: 20px;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        /* TABLE */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 480px;
        }

        th {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-size: 0.85rem;
            background-color: var(--bg-elevated);
            color: var(--brass);
            padding: 14px 10px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 14px 10px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.015);
        }

        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: 700;
            font-size: 0.85rem;
            background-color: var(--bg-elevated);
            color: var(--text-main);
        }

        .rank-1 {
            background-color: var(--brass);
            color: #121417;
        }

        .points-cell {
            font-family: 'Oswald', sans-serif;
            font-size: 1.15rem;
            color: var(--dart-green-light);
            font-weight: 700;
        }

        .scoring-legend {
            margin-top: 12px;
            font-size: 0.82rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* SCHEDULE & SPIELFREI BANNER */
        .matchday-controls {
            margin-bottom: 18px;
        }

        .matchday-controls label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .matchday-select {
            width: 100%;
            background-color: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--sisal-cream);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            min-height: 48px;
            outline: none;
        }

        .matchday-select:focus {
            border-color: var(--brass);
        }

        .bye-banner {
            background: linear-gradient(90deg, rgba(21, 128, 61, 0.22) 0%, rgba(212, 175, 55, 0.15) 100%);
            border: 1px solid rgba(34, 197, 94, 0.45);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Oswald', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 0.5px;
            color: var(--sisal-cream);
            text-transform: uppercase;
        }

        .bye-banner .palm {
            font-size: 1.4rem;
        }

        .match-card {
            background-color: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .match-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .status-tag {
            padding: 3px 10px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tag-open {
            background-color: rgba(212, 175, 55, 0.18);
            color: var(--brass);
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        .tag-done {
            background-color: rgba(34, 197, 94, 0.18);
            color: var(--dart-green-light);
            border: 1px solid rgba(34, 197, 94, 0.4);
        }

        .match-versus {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .player-name {
            font-family: 'Oswald', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--sisal-cream);
            letter-spacing: 0.5px;
        }

        .score-box {
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 14px;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            color: var(--brass);
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 120px;
        }

        .match-actions {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
        }

        /* ADMIN TOOLS FOOTER */
        .admin-footer {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            display: none;
            flex-wrap: wrap;
            gap: 10px;
        }

        .admin-footer.visible {
            display: flex;
        }

        /* MODALS */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.82);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .modal-box {
            background-color: var(--bg-surface);
            border: 1px solid var(--brass);
            border-radius: 14px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
        }

        .modal-header {
            font-family: 'Oswald', sans-serif;
            font-size: 1.4rem;
            color: var(--brass);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .modal-sub {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 18px;
        }

        .modal-input {
            width: 100%;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            min-height: 46px;
            outline: none;
        }

        .modal-input:focus {
            border-color: var(--brass);
        }

        .leg-group {
            background-color: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .leg-group-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--brass);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .leg-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .leg-inputs label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: var(--sisal-cream);
        }

        .leg-inputs input {
            width: 100%;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            min-height: 46px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--bg-elevated);
            border: 1px solid var(--brass);
            color: var(--sisal-cream);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            transition: transform 0.25s ease;
            z-index: 2000;
            text-align: center;
            max-width: 90vw;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 540px) {
            body {
                padding: 8px;
            }
            .brand-title {
                font-size: 1.65rem;
            }
            .match-versus {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .score-box {
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

<div class="app-shell">
    <!-- HEADER MIT KOMPAKTEM ADMIN-BUTTON -->
    <header class="hero-header">
        <div class="brand-group">
            <div class="brand-title">🎯 Dart Club <span class="accent">JJAGD</span></div>
            <div class="season-sub">Saison 2026 / 2027</div>
        </div>

        <button id="admin-btn" class="admin-trigger" onclick="handleAdminButtonClick()">🔒 Admin</button>
    </header>

    <!-- NAVIGATION TABS -->
    <div class="nav-tabs">
        <button class="tab-btn active" id="btn-tab-schedule" onclick="switchTab('schedule')">📅 Spielplan</button>
        <button class="tab-btn" id="btn-tab-table" onclick="switchTab('table')">🏆 Tabelle</button>
    </div>

    <main class="content-body">
        <!-- TAB: SPIELPLAN -->
        <section id="pane-schedule" class="tab-pane active">
            <div class="matchday-controls">
                <label for="matchday-select">Spieltag auswählen:</label>
                <select id="matchday-select" class="matchday-select" onchange="renderSchedule()"></select>
            </div>

            <!-- SPIELFREI BANNER OBEN -->
            <div id="bye-banner-container"></div>

            <!-- PARTIEN -->
            <div id="matches-container"></div>
        </section>

        <!-- TAB: TABELLE -->
        <section id="pane-table" class="tab-pane">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Platz</th>
                            <th style="text-align: left;">Spieler</th>
                            <th>Spiele</th>
                            <th>Siege</th>
                            <th>Nied.</th>
                            <th>Legs</th>
                            <th>Punkte</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
            <div class="scoring-legend">
                Wertung: 1 Punkt pro gewonnenem Leg + 1 Bonuspunkt für den Matchsieg (bei 5 Legs).
            </div>
        </section>

        <!-- ADMIN BACKUP & EXPORT (NUR SICHTBAR FÜR JAN) -->
        <div id="admin-tools-footer" class="admin-footer">
            <button class="btn btn-outline btn-sm" onclick="exportBackupJSON()">💾 Backup speichern (JSON)</button>
            <button class="btn btn-outline btn-sm" onclick="document.getElementById('import-file-input').click()">📂 Backup laden</button>
            <button class="btn btn-outline btn-sm" onclick="exportTableCSV()">📊 Tabelle als CSV</button>
            <input type="file" id="import-file-input" accept=".json" style="display: none;" onchange="importBackupJSON(event)">
        </div>
    </main>
</div>

<!-- MODAL: ADMIN LOGIN -->
<div id="login-modal" class="modal-backdrop">
    <div class="modal-box" style="max-width: 340px;">
        <div class="modal-header">Admin Login</div>
        <div class="modal-sub">Passwort für Jan eingeben:</div>
        <input type="password" id="admin-pass-input" class="modal-input" placeholder="Passwort" onkeydown="if(event.key==='Enter') submitAdminLogin()">
        <div class="modal-footer">
            <button class="btn btn-outline btn-sm" onclick="closeLoginModal()">Abbrechen</button>
            <button class="btn btn-brass btn-sm" onclick="submitAdminLogin()">Login</button>
        </div>
    </div>
</div>

<!-- MODAL: ERGEBNIS EINTRAGEN (NUR ADMIN JAN) -->
<div id="result-modal" class="modal-backdrop">
    <div class="modal-box">
        <div class="modal-header">Ergebnis eintragen</div>
        <div class="modal-sub" id="modal-match-label">Spieler 1 vs. Spieler 2</div>

        <div class="leg-group">
            <div class="leg-group-title">Match 1 (First to 5 Legs)</div>
            <div class="leg-inputs">
                <div>
                    <label id="lbl-m1-p1">Spieler 1</label>
                    <input type="number" id="inp-m1-p1" min="0" max="5">
                </div>
                <div>
                    <label id="lbl-m1-p2">Spieler 2</label>
                    <input type="number" id="inp-m1-p2" min="0" max="5">
                </div>
            </div>
        </div>

        <div class="leg-group">
            <div class="leg-group-title">Match 2 (First to 5 Legs)</div>
            <div class="leg-inputs">
                <div>
                    <label id="lbl-m2-p1">Spieler 1</label>
                    <input type="number" id="inp-m2-p1" min="0" max="5">
                </div>
                <div>
                    <label id="lbl-m2-p2">Spieler 2</label>
                    <input type="number" id="inp-m2-p2" min="0" max="5">
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeResultModal()">Abbrechen</button>
            <button class="btn btn-green" onclick="saveMatchResult()">Speichern</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    const PLAYERS = ["Adrian", "Jeff", "Dennis", "Achim", "Jan"];
    const START_DATE = new Date("2026-11-13T00:00:00");
    const ADMIN_PASSWORD = "Lembeck91";
    const STORAGE_KEY = "dart_club_jjagd_v3";

    let isAdmin = false;
    let schedule = [];
    let editingMatchId = null;

    window.onload = function() {
        loadSchedule();
        populateMatchdayDropdown();
        selectCurrentMatchdayByDate();
        renderSchedule();
        renderTable();
    };

    function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
    }

    function loadSchedule() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                schedule = JSON.parse(saved);
                return;
            } catch (e) {
                console.error("Fehler beim Laden der Daten:", e);
            }
        }
        createInitialSchedule();
        saveSchedule();
    }

    function saveSchedule() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(schedule));
    }

    function createInitialSchedule() {
        const rounds = [
            // 1. Spieltag
            [
                { p1: "Jan", p2: "Dennis" },
                { p1: "Achim", p2: "Adrian" },
                { p1: "Jeff", p2: null }
            ],
            // 2. Spieltag
            [
                { p1: "Adrian", p2: "Jan" },
                { p1: "Dennis", p2: "Jeff" },
                { p1: "Achim", p2: null }
            ],
            // 3. Spieltag
            [
                { p1: "Jeff", p2: "Adrian" },
                { p1: "Jan", p2: "Achim" },
                { p1: "Dennis", p2: null }
            ],
            // 4. Spieltag
            [
                { p1: "Achim", p2: "Jeff" },
                { p1: "Adrian", p2: "Dennis" },
                { p1: "Jan", p2: null }
            ],
            // 5. Spieltag
            [
                { p1: "Dennis", p2: "Achim" },
                { p1: "Jeff", p2: "Jan" },
                { p1: "Adrian", p2: null }
            ]
        ];

        schedule = [];
        let idCounter = 1;

        rounds.forEach((roundMatches, idx) => {
            const start = new Date(START_DATE);
            start.setDate(START_DATE.getDate() + idx * 14);
            const end = new Date(start);
            end.setDate(start.getDate() + 13);

            const period = `${start.toLocaleDateString("de-DE")} – ${end.toLocaleDateString("de-DE")}`;

            roundMatches.forEach(pair => {
                schedule.push({
                    id: idCounter++,
                    matchday: idx + 1,
                    period: period,
                    p1: pair.p1,
                    p2: pair.p2,
                    m1_p1: null,
                    m1_p2: null,
                    m2_p1: null,
                    m2_p2: null,
                    completed: false
                });
            });
        });
    }

    // ADMIN BUTTON & LOGIN MODAL
    function handleAdminButtonClick() {
        if (isAdmin) {
            isAdmin = false;
            updateAdminUI();
            renderSchedule();
            showToast("Admin-Modus beendet.");
        } else {
            const input = document.getElementById("admin-pass-input");
            input.value = "";
            document.getElementById("login-modal").classList.add("active");
            setTimeout(() => input.focus(), 50);
        }
    }

    function closeLoginModal() {
        document.getElementById("login-modal").classList.remove("active");
    }

    function submitAdminLogin() {
        const input = document.getElementById("admin-pass-input");
        if (input.value === ADMIN_PASSWORD) {
            isAdmin = true;
            closeLoginModal();
            updateAdminUI();
            renderSchedule();
            showToast("Willkommen Jan! Admin-Modus aktiv.");
        } else {
            showToast("Falsches Passwort!");
        }
    }

    function updateAdminUI() {
        const btn = document.getElementById("admin-btn");
        const footerTools = document.getElementById("admin-tools-footer");

        if (isAdmin) {
            btn.textContent = "👑 Admin (Logout)";
            btn.classList.add("logged-in");
            footerTools.classList.add("visible");
        } else {
            btn.textContent = "🔒 Admin";
            btn.classList.remove("logged-in");
            footerTools.classList.remove("visible");
        }
    }

    // SPIELTAG AUSWAHL & DATUMSAUTOMATIK
    function populateMatchdayDropdown() {
        const select = document.getElementById("matchday-select");
        select.innerHTML = "";
        for (let day = 1; day <= 5; day++) {
            const sample = schedule.find(m => m.matchday === day);
            const opt = document.createElement("option");
            opt.value = day;
            opt.textContent = `${day}. Spieltag (${sample ? sample.period : ""})`;
            select.appendChild(opt);
        }
    }

    function selectCurrentMatchdayByDate() {
        const now = new Date();
        let activeDay = 1;

        for (let i = 0; i < 5; i++) {
            const start = new Date(START_DATE);
            start.setDate(START_DATE.getDate() + i * 14);
            const end = new Date(start);
            end.setDate(start.getDate() + 13);
            end.setHours(23, 59, 59, 999);

            if (now >= start && now <= end) {
                activeDay = i + 1;
                break;
            } else if (now > end) {
                activeDay = Math.min(i + 2, 5);
            }
        }
        document.getElementById("matchday-select").value = activeDay;
    }

    // RENDER SPIELPLAN
    function renderSchedule() {
        const selectedDay = parseInt(document.getElementById("matchday-select").value, 10);
        const dayItems = schedule.filter(m => m.matchday === selectedDay);

        const byeContainer = document.getElementById("bye-banner-container");
        const matchesContainer = document.getElementById("matches-container");

        byeContainer.innerHTML = "";
        matchesContainer.innerHTML = "";

        // 1. Spielfreien Spieler ganz oben anzeigen
        const byeItem = dayItems.find(m => m.p2 === null);
        if (byeItem) {
            byeContainer.innerHTML = `
                <div class="bye-banner">
                    <span class="palm">🌴</span>
                    <span>${byeItem.p1} spielfrei</span>
                </div>
            `;
        }

        // 2. Reguläre Partien darunter anzeigen
        const activeMatches = dayItems.filter(m => m.p2 !== null);
        activeMatches.forEach(m => {
            const card = document.createElement("div");
            card.className = "match-card";

            const badge = m.completed
                ? `<span class="status-tag tag-done">Gespielt</span>`
                : `<span class="status-tag tag-open">Offen</span>`;

            const scoreHtml = m.completed
                ? `<div>Match 1: <strong>${m.m1_p1} : ${m.m1_p2}</strong></div>
                   <div>Match 2: <strong>${m.m2_p1} : ${m.m2_p2}</strong></div>`
                : `<div style="color: var(--text-muted); font-size: 0.9rem;">VS</div>`;

            const adminBtnHtml = isAdmin
                ? `<div class="match-actions">
                       <button class="btn ${m.completed ? 'btn-outline' : 'btn-brass'} btn-sm" onclick="openResultModal(${m.id})">
                           ${m.completed ? '✏️ Ergebnis bearbeiten' : '➕ Ergebnis eintragen'}
                       </button>
                   </div>`
                : "";

            card.innerHTML = `
                <div class="match-meta">
                    <span>Zeitraum: ${m.period}</span>
                    ${badge}
                </div>
                <div class="match-versus">
                    <div class="player-name">${m.p1}</div>
                    <div class="score-box">${scoreHtml}</div>
                    <div class="player-name">${m.p2}</div>
                </div>
                ${adminBtnHtml}
            `;
            matchesContainer.appendChild(card);
        });
    }

    // RENDER TABELLE
    function renderTable() {
        const stats = {};
        PLAYERS.forEach(p => {
            stats[p] = {
                name: p,
                played: 0,
                wins: 0,
                losses: 0,
                legsWon: 0,
                legsLost: 0,
                points: 0
            };
        });

        schedule.forEach(m => {
            if (m.completed && m.p2 !== null) {
                applySingleMatch(stats, m.p1, m.p2, m.m1_p1, m.m1_p2);
                applySingleMatch(stats, m.p1, m.p2, m.m2_p1, m.m2_p2);
            }
        });

        const ranking = Object.values(stats).sort((a, b) => {
            if (b.points !== a.points) return b.points - a.points;
            const diffA = a.legsWon - a.legsLost;
            const diffB = b.legsWon - b.legsLost;
            if (diffB !== diffA) return diffB - diffA;
            return b.legsWon - a.legsWon;
        });

        const tbody = document.getElementById("table-body");
        tbody.innerHTML = "";

        ranking.forEach((row, index) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><span class="rank-badge ${index === 0 ? 'rank-1' : ''}">${index + 1}</span></td>
                <td style="text-align: left; font-weight: 700; color: var(--sisal-cream);">${row.name}</td>
                <td>${row.played}</td>
                <td>${row.wins}</td>
                <td>${row.losses}</td>
                <td>${row.legsWon}:${row.legsLost}</td>
                <td class="points-cell">${row.points}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function applySingleMatch(stats, p1, p2, s1, s2) {
        if (s1 === null || s2 === null) return;

        stats[p1].played += 1;
        stats[p2].played += 1;

        stats[p1].legsWon += s1;
        stats[p1].legsLost += s2;
        stats[p2].legsWon += s2;
        stats[p2].legsLost += s1;

        // 1 Punkt pro Leg
        stats[p1].points += s1;
        stats[p2].points += s2;

        // +1 Bonuspunkt für den Matchgewinn (bei 5 Legs)
        if (s1 === 5) {
            stats[p1].wins += 1;
            stats[p2].losses += 1;
            stats[p1].points += 1;
        } else if (s2 === 5) {
            stats[p2].wins += 1;
            stats[p1].losses += 1;
            stats[p2].points += 1;
        }
    }

    // MODAL ERGEBNISSE (NUR ADMIN)
    function openResultModal(matchId) {
        if (!isAdmin) return;
        editingMatchId = matchId;
        const m = schedule.find(item => item.id === matchId);
        if (!m) return;

        document.getElementById("modal-match-label").textContent = `${m.p1} vs. ${m.p2} (${m.matchday}. Spieltag)`;
        document.getElementById("lbl-m1-p1").textContent = m.p1;
        document.getElementById("lbl-m1-p2").textContent = m.p2;
        document.getElementById("lbl-m2-p1").textContent = m.p1;
        document.getElementById("lbl-m2-p2").textContent = m.p2;

        document.getElementById("inp-m1-p1").value = m.m1_p1 !== null ? m.m1_p1 : 0;
        document.getElementById("inp-m1-p2").value = m.m1_p2 !== null ? m.m1_p2 : 0;
        document.getElementById("inp-m2-p1").value = m.m2_p1 !== null ? m.m2_p1 : 0;
        document.getElementById("inp-m2-p2").value = m.m2_p2 !== null ? m.m2_p2 : 0;

        document.getElementById("result-modal").classList.add("active");
    }

    function closeResultModal() {
        document.getElementById("result-modal").classList.remove("active");
        editingMatchId = null;
    }

    function saveMatchResult() {
        if (!isAdmin || editingMatchId === null) return;

        const m1p1 = parseInt(document.getElementById("inp-m1-p1").value, 10);
        const m1p2 = parseInt(document.getElementById("inp-m1-p2").value, 10);
        const m2p1 = parseInt(document.getElementById("inp-m2-p1").value, 10);
        const m2p2 = parseInt(document.getElementById("inp-m2-p2").value, 10);

        if ([m1p1, m1p2, m2p1, m2p2].some(v => isNaN(v) || v < 0 || v > 5)) {
            showToast("Bitte gültige Leg-Zahlen (0 bis 5) eingeben.");
            return;
        }

        const m = schedule.find(item => item.id === editingMatchId);
        m.m1_p1 = m1p1;
        m.m1_p2 = m1p2;
        m.m2_p1 = m2p1;
        m.m2_p2 = m2p2;
        m.completed = true;

        saveSchedule();
        closeResultModal();
        renderSchedule();
        renderTable();
        showToast("Ergebnis gespeichert & Tabelle aktualisiert!");
    }

    // TABS
    function switchTab(tab) {
        document.getElementById("btn-tab-schedule").classList.toggle("active", tab === "schedule");
        document.getElementById("btn-tab-table").classList.toggle("active", tab === "table");
        document.getElementById("pane-schedule").classList.toggle("active", tab === "schedule");
        document.getElementById("pane-table").classList.toggle("active", tab === "table");
    }

    // BACKUP & EXPORT
    function exportBackupJSON() {
        const blob = new Blob([JSON.stringify(schedule, null, 2)], { type: "application/json" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `dart_club_jjagd_backup_${new Date().toISOString().slice(0, 10)}.json`;
        link.click();
    }

    function importBackupJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if (Array.isArray(imported) && imported.length > 0) {
                    schedule = imported;
                    saveSchedule();
                    renderSchedule();
                    renderTable();
                    showToast("Backup erfolgreich geladen!");
                } else {
                    showToast("Ungültige Backup-Datei.");
                }
            } catch (err) {
                showToast("Fehler beim Lesen der Backup-Datei.");
            }
        };
        reader.readAsText(file);
    }

    function exportTableCSV() {
        let csv = "Platz;Spieler;Spiele;Siege;Niederlagen;Legs;Punkte\n";
        const rows = document.querySelectorAll("#table-body tr");
        rows.forEach(tr => {
            const cols = Array.from(tr.querySelectorAll("td")).map(td => td.textContent.trim());
            csv += cols.join(";") + "\n";
        });

        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `dart_club_jjagd_tabelle_${new Date().toISOString().slice(0, 10)}.csv`;
        link.click();
    }
</script>
